[project]
name = "steps"
version = "0.1.0"
description = "AWS Lambda function with Poetry dependency management"
authors = [{ name = "Ewan Li", email = "ewan.li@icloud.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "aws-lambda-powertools>=2.32.0",
    "boto3>=1.34.0",
    "pydantic>=2.6.0",
    "requests (>=2.32.3,<3.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "boto3-stubs[essential]>=1.34.0",
]

[tool.poetry]
packages = [{ include = "steps", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 88
